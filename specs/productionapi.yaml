            - CONTACTS_READ
      parameters:
        - name: source
          in: query
          description: Elasticsearch query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  _meta:
                    $ref: '#/components/schemas/Meta'
