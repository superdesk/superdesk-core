openapi: '3.0.2'

info:
  title: Superdesk Production API
  version: "2.0"
  description: |
    Production API server provides stable and versioned endpoints for third-party apps to consume news content from Superdesk.

    Production API uses the same DB and Elasticsearch index as the main Superdesk app, unlike Content API which has a separate DB.

    Production API uses versioned endpoints to provide a stable API with non-breaking changes for third-party apps.

    Authentication is based on OAuth 2.0 and uses the Superdesk Auth Server: https://superdesk.readthedocs.io/en/latest/auth_server.html

    Datetime strings use RFC 3339 by default, for example `2026-10-20T07:56:49+00:00`.
    UTC may also be represented by `Z`, and fractional seconds may be included.
    Date-only fields use `YYYY-MM-DD`.

    For legacy clients, set `PRODAPI_RFC3339_DATETIME=false` in the environment or
    `PRODAPI_RFC3339_DATETIME = False` in server settings and restart the Production API.
    This uses compact timezone offsets such as `+0000` instead of `+00:00` or `Z`.
    That compatibility mode is not RFC 3339 and does not conform to the `date-time`
    formats declared in this specification. It affects only Production API JSON
    responses, not stored data or other APIs.

servers:
  - url: /prodapi/v1
    description: Production API v1 Server

security:
  - oauth2Auth: []

paths:
  /:
    get:
      summary: List all endpoints
      description: Returns list of all available endpoints in the Production API
      tags:
        - General
      responses:
        '200':
          description: List of endpoints
          content:
            application/json:
              schema:
                type: object

  /items:
    get:
      summary: List items
      description: Get list of content items with elastic search query support
      tags:
        - Items
      security:
        - oauth2Auth:
            - ARCHIVE_READ
      parameters:
        - name: source
          in: query
          description: Elasticsearch query in JSON format
          required: false
          schema:
            type: string
          example: '{"query":{"filtered":{"filter":{"terms":{"type":["composite"]}}}}}'
      responses:
        '200':
          description: List of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /items/{guid}:
    get:
      summary: Get item details
      description: Retrieve a specific item by its GUID
      tags:
        - Items
      security:
        - oauth2Auth:
            - ARCHIVE_READ
      parameters:
        - $ref: '#/components/parameters/guid'
      responses:
        '200':
          description: Item details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /desks:
    get:
      summary: List desks
      description: Get list of desks with MongoDB query support
      tags:
        - Desks
      security:
        - oauth2Auth:
            - DESKS_READ
      parameters:
        - name: where
          in: query
          description: MongoDB query in JSON format
          required: false
          schema:
            type: string
          example: '{"name": "Production"}'
      responses:
        '200':
          description: List of desks
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Desk'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /desks/{_id}:
    get:
      summary: Get desk details
      description: Retrieve a specific desk by its ID
      tags:
        - Desks
      security:
        - oauth2Auth:
            - DESKS_READ
      parameters:
        - $ref: '#/components/parameters/_id'
      responses:
        '200':
          description: Desk details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desk'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /content_lists:
    get:
      summary: List content lists
      description: Get list of content lists with MongoDB query support. By default only enabled lists are returned.
      tags:
        - Content Lists
      security:
        - oauth2Auth:
            - CONTENT_LISTS_READ
      parameters:
        - name: where
          in: query
          description: MongoDB query in JSON format
          required: false
          schema:
            type: string
          example: '{"type": "manual"}'
        - name: enabled
          in: query
          description: Filter by enabled state. Use true to include only enabled lists, false for disabled lists only, or all to disable the default filter.
          required: false
          schema:
            type: string
            enum: ["true", "false", "all"]
          example: "true"
      responses:
        '200':
          description: List of content lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentList'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /content_lists/{list_id}/items:
    get:
      summary: List items in a content list
      description: Get the items contained in a specific content list. By default only enabled items are returned.
      tags:
        - Content Lists
      security:
        - oauth2Auth:
            - CONTENT_LISTS_READ
      parameters:
        - $ref: '#/components/parameters/list_id'
        - name: enabled
          in: query
          description: Filter by enabled state. Use true to include only enabled items, false for disabled items only, or all to disable the default filter.
          required: false
          schema:
            type: string
            enum: ["true", "false", "all"]
          example: "true"
      responses:
        '200':
          description: List of content list items
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentListItem'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /assignments:
    get:
      summary: List assignments
      description: Get list of assignments with elastic search query support
      tags:
        - Assignments
      security:
        - oauth2Auth:
            - ASSIGNMENTS_READ
      parameters:
        - name: source
          in: query
          description: Elasticsearch query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /assignments/{_id}:
    get:
      summary: Get assignment details
      description: Retrieve a specific assignment by its ID
      tags:
        - Assignments
      security:
        - oauth2Auth:
            - ASSIGNMENTS_READ
      parameters:
        - $ref: '#/components/parameters/_id'
      responses:
        '200':
          description: Assignment details with HATEOAS links
          content:
            application/json:
              examples:
                assignment:
                  $ref: '#/components/examples/EventAssignment'
              schema:
                $ref: '#/components/schemas/Assignment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /planning:
    get:
      summary: List planning items
      description: Get list of planning items with elastic search query support
      tags:
        - Planning
      security:
        - oauth2Auth:
            - PLANNING_READ
      parameters:
        - name: source
          in: query
          description: Elasticsearch query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
