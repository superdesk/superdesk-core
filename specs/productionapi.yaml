          description: Event file details
          content:
            application/json:
              examples:
                attachment:
                  $ref: '#/components/examples/EventAttachment'
              schema:
                $ref: '#/components/schemas/EventFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events_history:
    get:
      summary: List events history
      description: Get list of event history records with MongoDB query support
      tags:
        - Events
      security:
        - oauth2Auth:
            - EVENTS_READ
      parameters:
        - name: where
          in: query
          description: MongoDB query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of event history records
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventHistory'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events_history/{_id}:
    get:
      summary: Get event history details
      description: Retrieve a specific event history record by its ID
      tags:
        - Events
      security:
        - oauth2Auth:
            - EVENTS_READ
      parameters:
        - $ref: '#/components/parameters/_id'
      responses:
        '200':
          description: Event history details
          content:
            application/json:
              examples:
                update:
                  $ref: '#/components/examples/EventHistoryUpdate'
              schema:
                $ref: '#/components/schemas/EventHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users:
    get:
      summary: List users
      description: Get list of users with MongoDB query support
      tags:
        - Users
      security:
        - oauth2Auth:
            - USERS_READ
      parameters:
        - name: where
          in: query
          description: MongoDB query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{_id}:
    get:
      summary: Get user details
      description: Retrieve a specific user by their ID
      tags:
        - Users
      security:
        - oauth2Auth:
            - USERS_READ
      parameters:
        - $ref: '#/components/parameters/_id'
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
