    EventFile:
      type: object
      description: File attached to an event
      properties:
        _id:
          type: string
          example: "60e6a117de25009b39121d81"
        media:
          type: string
          description: Media ID
        mimetype:
          type: string
        filemeta:
          type: object
          properties:
            media_id:
              type: string
              example: "5e05dd3f05add39732aa8436"
            filename:
              type: string
            content_type:
              type: string
            length:
              type: integer
              description: File size in bytes

    EventHistory:
      type: object
      description: Event history record
      properties:
        _id:
          type: string
          example: "60e6a118de25009b39121d82"
        item_id:
          type: string
          description: ID of the event whose history is recorded
          example: "60e6a116de25009b39121d80"
        item_type:
          type: string
          enum: [event]
        user_id:
          type: string
          nullable: true
        operation:
          type: string
          description: History action, including create, update and workflow actions
          example: "update"
        update:
          type: object
          description: Changes made in this update

    User:
      type: object
      description: System user
      properties:
        _id:
          type: string
          example: "5c489481405ecc015e5e10bd"
        username:
          type: string
          example: "john.doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        display_name:
          type: string
          example: "John Doe"

    Contact:
      type: object
      description: Contact information
      properties:
        _id:
          type: string
          example: "60e6a119de25009b39121d83"
        first_name:
          type: string
          example: "Jane"
        last_name:
          type: string
          example: "Smith"
        honorific:
          type: string
        organisation:
          type: string
        job_title:
          type: string
        is_active:
          type: boolean
        public:
          type: boolean
        contact_address:
          type: array
          items:
            type: string
        contact_email:
          type: array
          items:
            type: string
            format: email
          example: ["jane.smith@example.com"]
        contact_phone:
          type: array
          items:
            type: object
            properties:
              number:
                type: string
              usage:
                type: string
              public:
                type: boolean

    UserAvailability:
      type: object
      properties:
        username:
          type: string
          example: "admin"
        availability:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2023-05-01"
              status:
                type: string
                enum:
                  - available
                  - unavailable
                  - partial
                example: "available"
              published_articles:
                type: integer
                example: 5
              published_events:
                type: integer
                example: 2
              working_hours:
                type: array
                items:
                  type: object
                  properties:
                    start:
                      type: string
                      example: "09:00"
                    end:
                      type: string
                      example: "17:00"

    UserMetric:
      type: object
      description: Metric recorded for a user
      properties:
        date:
          type: string
          format: date
          example: "2023-05-01"
        user:
          type: string
          description: User ID
          example: "5c489481405ecc015e5e10bd"
        name:
          type: string
          example: "published_articles"
        value:
          type: number
          example: 5

    ErrorResponse:
      type: object
      required: [_status, _error]
      properties:
        _status:
          type: string
          example: "ERR"
        _error:
          type: object
          required: [code, message]
          properties:
            code:
              type: integer
              example: 400
            message:
              type: string
              example: "Invalid value for 'enabled', must be one of: true, false, all"
        _issues:
          type: object
          description: Optional details about the error
          additionalProperties: true

  responses:
    BadRequest:
      description: Bad Request - Invalid query parameter value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized - Invalid or missing access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden - Access token does not have the required scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'