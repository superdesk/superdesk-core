      security:
        - oauth2Auth:
            - CONTACTS_READ
      parameters:
        - $ref: '#/components/parameters/_id'
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              examples:
                contact:
                  $ref: '#/components/examples/EventContact'
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
