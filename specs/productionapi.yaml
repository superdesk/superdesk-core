                recurring:
                  $ref: '#/components/examples/RecurringEvent'
                allDay:
                  $ref: '#/components/examples/AllDayEvent'
                unconfirmed:
                  $ref: '#/components/examples/UnconfirmedEvent'
                cancelled:
                  $ref: '#/components/examples/CancelledEvent'
                rescheduled:
                  $ref: '#/components/examples/RescheduledEvent'
                rescheduledReplacement:
                  $ref: '#/components/examples/RescheduledReplacement'
                duplicated:
                  $ref: '#/components/examples/DuplicatedEvent'
