  /events:
    get:
      summary: List events
      description: Get list of events with elastic search query support
      tags:
        - Events
      security:
        - oauth2Auth:
            - EVENTS_READ
      parameters:
        - name: source
          in: query
          description: Elasticsearch query in JSON format
          required: false
          schema:
            type: string
        - name: planning_source
          in: query
          description: Elasticsearch query over planning items; returns their primary related events
          schema:
            type: string
          example: '{"query":{"match":{"slugline":"COUNCIL"}}}'
        - name: exclude_assignments
          in: query
          description: Omit _links.assignments while retaining planning links and coverage summaries
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of events
          content:
            application/json:
              examples:
                events:
                  $ref: '#/components/examples/EventList'
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/{guid}:
    get:
      summary: Get event details
      description: Retrieve a specific event by its GUID
      tags:
        - Events
      security:
        - oauth2Auth:
            - EVENTS_READ
      parameters:
        - $ref: '#/components/parameters/guid'
        - name: exclude_assignments
          in: query
          description: Omit _links.assignments while retaining planning links and coverage summaries
