      description: News content item
      properties:
        _id:
          type: string
          example: "60e6a257de25009b39121d81"
        guid:
          type: string
          example: "urn:newsml:localhost:2021-07-06T11:12:48.695851:60e403bc-8361-feb5-6647-19b1"
        type:
          type: string
          enum: [text, picture, video, audio, composite]
          example: "text"
        headline:
          type: string
          example: "Breaking news story"
        body_html:
          type: string
          description: HTML content of the item
        state:
          type: string
          description: Workflow state of the item
          example: "published"
        pubstatus:
          type: string
          example: "usable"
        assignment_id:
          type: string
          example: "60e403bc8361feb5664719b1"
        task:
          type: object
          properties:
            desk:
              type: string
              example: "5c489481405ecc015e5e10bc"
        _links:
          type: object
          description: HATEOAS links to related resources
          properties:
            assignment:
              $ref: '#/components/schemas/HATEOASAssignment'
            planning:
              $ref: '#/components/schemas/HATEOASPlanning'
            event:
              $ref: '#/components/schemas/HATEOASEvent'

    Desk:
      type: object
      description: Editorial desk
      properties:
        _id:
          type: string
          example: "5c489481405ecc015e5e10bc"
        name:
          type: string
          example: "Production"
        description:
          type: string
          example: "Main production desk"

    ContentList:
      type: object
      description: Content list metadata and links
      properties:
        _id:
          type: string
          example: "66f0000000000000000000a1"
        name:
          type: string
          example: "Front page"
        type:
          type: string
          example: "manual"
        description:
          type: string
          nullable: true
          example: "Top stories for the front page"
        enabled:
          type: boolean
          example: true
        limit:
          type: integer
          example: 10
        content_list_items_updated_at:
          type: string
          format: date-time
          example: "2024-09-29T12:00:00+00:00"
        _links:
          type: object
          description: HATEOAS links to related resources
          properties:
            items:
              type: object
              properties:
                title:
                  type: string
                  example: "Items"
                href:
                  type: string
                  example: "content_lists/66f0000000000000000000a1/items"

    ContentListItem:
      type: object
      description: Item contained in a content list
      properties:
        _id:
          type: string
          example: "66f0000000000000000000a2"
        list_id:
          type: string
          example: "66f0000000000000000000a1"
        content:
          type: string
          description: Item GUID or content identifier
          example: "urn:newsml:localhost:2021-07-06T11:12:48.695851:60e403bc-8361-feb5-6647-19b1"
        position:
          type: integer
          example: 0
        enabled:
          type: boolean
          example: true
        sticky:
          type: boolean
          example: true
        article_content:
          type: object
          nullable: true
          description: Enriched article content when available
          additionalProperties: true

    Assignment:
      type: object
      description: Content assignment
      properties:
        _id:
          type: string
          example: "60e403bc8361feb5664719b1"
        type:
          type: string
          enum: [assignment]
        planning_item:
          type: string
          description: ID of the linked planning item
        coverage_item:
          type: string
          description: ID of the linked coverage
        scheduled_update_id:
          type: string
          nullable: true
        priority:
          type: integer
        accepted:
          type: boolean
        assigned_to:
          allOf:
            - $ref: '#/components/schemas/CoverageAssignedTo'
          description: Assignment state is stored in assigned_to.state
        planning:
          $ref: '#/components/schemas/AssignmentPlanning'
        firstcreated:
          type: string
          format: date-time
        versioncreated:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
          nullable: true
        published_state:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        description_text:
          type: string
          nullable: true
        original_creator:
          type: string
          nullable: true
        version_creator:
          type: string
          nullable: true
        _to_delete:
          type: boolean

        _links:
          type: object
          description: HATEOAS links to related resources
          properties:
            planning:
              $ref: '#/components/schemas/HATEOASPlanning'
            event:
              $ref: '#/components/schemas/HATEOASEvent'
            related_events:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASEvent'
            content:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASContent'

    Planning:
      type: object
      description: |
        Planning item. Unlike Event, dates are exposed as planning_date and all_day.
        Coverage descriptions and keywords also include the legacy description_text
        and keyword aliases. Lock fields, item_class, flags and internal schedules
        are omitted by this endpoint.
      allOf:
        - $ref: '#/components/schemas/ItemEditorialMetadata'
        - $ref: '#/components/schemas/ItemDetails'
      properties:
        _id:
          type: string
          example: "60e6a115de25009b39121d7f"
        guid:
          type: string
          example: "urn:newsml:localhost:2021-07-08T12:34:56.123456:planning-guid"
        slugline:
          type: string
          example: "City Council Meeting"
        description_text:
          type: string
          example: "Coverage of the monthly city council meeting"
        planning_date:
          type: string
          format: date-time
          description: Start date and time of the planning item (mapped from dates.start)
          example: "2021-07-15T14:00:00+00:00"
        all_day:
          type: boolean
          description: Whether the planning item is scheduled for the whole day (mapped from dates.all_day)
        type:
          type: string
          enum: [planning]
        state:
          type: string
        related_events:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              link_type:
                type: string
                enum: [primary, secondary]
              recurrence_id:
                type: string
                nullable: true
        coverages:
          type: array
          nullable: true
          description: Possible content coverages associated with the planning item
          items:
            $ref: '#/components/schemas/Coverage'
        _links:
          type: object
          description: HATEOAS links to related resources
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASAssignment'
            event:
              $ref: '#/components/schemas/HATEOASEvent'
            related_events:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASEvent'

    Event:
      type: object
      description: |
        Calendar event from the unified planning resource. Fields depend on the
        content profile and stored data; optional values may be absent or null.
        Custom vocabulary values use subject.scheme and installation-specific
        data may appear in extra. Lock fields, _etag, _created, _updated,
        _current_version and fields_meta are not returned.

        coverages contains coverages stored directly on this event.
        _links.plannings contains primary linked planning items with compact
        coverage summaries; fetch the linked Planning resource for full records.
        _links.assignments is omitted when exclude_assignments=true.
      allOf:
        - $ref: '#/components/schemas/ItemEditorialMetadata'
        - $ref: '#/components/schemas/ItemDetails'
      properties:
        _id:
          type: string
          example: "60e6a116de25009b39121d80"
        guid:
          type: string
          example: "urn:newsml:localhost:2021-07-08T12:34:56.789012:event-guid"
        name:
          type: string
          example: "City Council Meeting"
        definition_short:
          type: string
          example: "Monthly meeting of the city council"
        type:
          type: string
          enum: [event]
        dates:
          $ref: '#/components/schemas/EventDates'
        occur_status:
          $ref: '#/components/schemas/OccurrenceStatus'
        news_coverage_status:
          $ref: '#/components/schemas/NewsCoverageStatus'
        _time_to_be_confirmed:
          type: boolean
        completed:
          type: boolean
        recurrence_id:
          type: string
          nullable: true
        previous_recurrence_id:
          type: string
          nullable: true
        planning_recurrence_id:
          type: string
          nullable: true
        state:
          type: string
          enum: [draft, active, ingested, scheduled, killed, cancelled, rescheduled, postponed, spiked]
        state_reason:
          type: string
          nullable: true
        pubstatus:
          type: string
          nullable: true
          enum: [usable, cancelled, null]
        revert_state:
          type: string
          nullable: true
        version:
          type: integer
          nullable: true
        unique_id:
          type: integer
          nullable: true
        unique_name:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        template:
          type: string
          nullable: true
        original_creator:
          type: string
          nullable: true
        version_creator:
          type: string
          nullable: true
        firstcreated:
          type: string
          format: date-time
        versioncreated:
          type: string
          format: date-time
        versionposted:
          type: string
          format: date-time
          nullable: true
        event_created:
          type: string
          format: date-time
          nullable: true
        event_lastmodified:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
          nullable: true
        original_source:
          type: string
          nullable: true
        ingest_id:
          type: string
          nullable: true
        ingest_provider:
          type: string
          nullable: true
        ingest_provider_sequence:
          type: string
          nullable: true
        ingest_firstcreated:
          type: string
          format: date-time
          nullable: true
        ingest_versioncreated:
          type: string
          format: date-time
          nullable: true
        ingest_pubstatus:
          type: string
          nullable: true
          enum: [usable, cancelled, null]
        expiry:
          type: string
          format: date-time
          nullable: true
        expired:
          type: boolean
        featured:
          type: boolean
        flags:
          type: object
          properties:
            marked_for_not_publication:
              type: boolean
            overide_auto_assign_to_workflow:
              type: boolean
              description: Field name retains the stored spelling
        item_class:
          type: string
          nullable: true
        duplicate_from:
          type: string
          nullable: true
        duplicate_to:
          type: array
          nullable: true
          items:
            type: string
        reschedule_from:
          type: string
          nullable: true
        reschedule_to:
          type: string
          nullable: true
        _reschedule_from_schedule:
          type: string
          format: date-time
          nullable: true
        actioned_date:
          type: string
          format: date-time
          nullable: true
        _planning_schedule:
          type: array
          items:
            type: object
            properties:
              scheduled:
                type: string
                format: date-time
              coverage_id:
                type: string
                nullable: true
        _updates_schedule:
          type: array
          nullable: true
          items:
            type: object
            properties:
              scheduled:
                type: string
                format: date-time
              scheduled_update_id:
                type: string
                nullable: true
        related_planning:
          type: array
          nullable: true
          items:
            type: object
            properties:
              _id:
                type: string
              link_type:
                type: string
                enum: [primary, secondary]
              recurrence_id:
                type: string
                nullable: true
        related_content:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/RelatedContent'
        coverages:
          type: array
          nullable: true
          description: Possible content coverages associated with the event
          items:
            $ref: '#/components/schemas/Coverage'
        _links:
          type: object
          description: HATEOAS links to related resources
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASAssignment'
            plannings:
              type: array
              items:
                $ref: '#/components/schemas/HATEOASPlanning'

    ItemEditorialMetadata:
