      summary: List user metrics
      description: Get list of user metrics with MongoDB query support
      tags:
        - User Metrics
      security:
        - oauth2Auth:
            - USERS_READ
      parameters:
        - name: where
          in: query
          description: MongoDB query in JSON format
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of user metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserMetric'
                  _meta:
                    $ref: '#/components/schemas/Meta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /contacts:
