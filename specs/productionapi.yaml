    EventDates:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          nullable: true
        tz:
          type: string
          nullable: true
          description: IANA timezone, e.g. Europe/Prague
        all_day:
          type: boolean
          description: Start and end are stored at UTC midnight for all-day events
        no_end_time:
          type: boolean
          description: End is a date at UTC midnight, not a known end time
        recurring_rule:
          type: object
          nullable: true
          properties:
            frequency:
              type: string
              enum: [DAILY, WEEKLY, MONTHLY, YEARLY]
            interval:
              type: integer
            endRepeatMode:
              type: string
              enum: [count, until]
            count:
              type: integer
              nullable: true
            until:
              type: string
              format: date-time
              nullable: true
            byday:
              type: string
              description: Space-separated weekdays, e.g. MO WE FR
              nullable: true
            _created_externally:
              type: boolean

