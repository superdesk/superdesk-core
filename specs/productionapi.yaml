      summary: Get user availability information
      tags:
        - User Availability
      security:
        - oauth2Auth:
            - USERS_READ
      parameters:
        - $ref: '#/components/parameters/month'
        - $ref: '#/components/parameters/day'
      responses:
        '200':
          description: List of user availabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  _items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /user_availability/{id}:
    parameters:
      - $ref: '#/components/parameters/userId'
      - $ref: '#/components/parameters/month'
      - $ref: '#/components/parameters/day'

    get:
      summary: Get specific user availability
      tags:
        - User Availability
      security:
        - oauth2Auth:
            - USERS_READ
      responses:
        '200':
          description: User availability record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAvailability'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    oauth2Auth:
      type: oauth2
      description: |
        OAuth 2.0 client credentials flow via Superdesk Auth Server.

        See: https://superdesk.readthedocs.io/en/latest/auth_server.html
      flows:
        clientCredentials:
          tokenUrl: /api/auth_server/token
          scopes:
            ARCHIVE_READ: Read archive items
            DESKS_READ: Read desks
            PLANNING_READ: Read planning items
            CONTACTS_READ: Read contacts
            USERS_READ: Read users and user availability
            ASSIGNMENTS_READ: Read assignments
            EVENTS_READ: Read events, event files and event history
            CONTENT_LISTS_READ: Read content lists and their items

  parameters:
    guid:
      name: guid
      in: path
      description: Unique identifier (GUID)
      required: true
      schema:
        type: string
      example: "urn:newsml:localhost:2021-07-06T11:12:48.695851:60e403bc-8361-feb5-6647-19b1"

    _id:
      name: _id
      in: path
      description: MongoDB Object ID
      required: true
      schema:
        type: string
      example: "60e403bc8361feb5664719b1"

    list_id:
      name: list_id
      in: path
      description: MongoDB Object ID of the content list
      required: true
      schema:
        type: string
      example: "66f0000000000000000000a1"

    userId:
      in: path
      name: id
      description: User ID
      schema:
        type: string
      required: true

    month:
      in: query
      name: month
      description: Filter availability by month (YYYY-MM format)
      schema:
        type: string
      example: "2023-05"

    day:
      in: query
      name: day
      description: Filter availability by specific day (YYYY-MM-DD format)
      schema:
        type: string
      example: "2023-05-16"

  examples:
    DetailedEvent:
      summary: Event with venues, taxonomy, contacts, files and several coverage types
      description: |
        Illustrative response, not an import payload. IDs link the examples in
        this section. Vocabulary qcodes, profile IDs and extra fields are
        installation-specific. Optional fields are populated to demonstrate
        their shapes, not to imply that every event returns them.
      value:
        _id: "urn:newsml:example.com:2026:event-council"
        guid: "urn:newsml:example.com:2026:event-council"
        type: event
        name: City Council Meeting
        slugline: COUNCIL-BUDGET
        headline: Council to debate the annual budget
        abstract: "<p>The council meets to discuss next year's budget.</p>"
        definition_short: Monthly meeting of the city council
        definition_long: "<p>Public session followed by a press briefing.</p>"
        internal_note: Reporter access opens 30 minutes before the meeting.
        ednote: Budget figures remain provisional until the vote.
        dates:
          start: "2026-11-02T09:00:00+00:00"
          end: "2026-11-02T11:00:00+00:00"
          tz: Europe/Prague
          all_day: false
          no_end_time: false
          recurring_rule: null
        _time_to_be_confirmed: false
        occur_status:
          qcode: "eocstat:eos5"
          name: Planned, occurs certainly
          label: Planned, occurs certainly
        news_coverage_status:
          qcode: "ncostat:int"
          name: Coverage intended
          label: Coverage intended
        state: scheduled
        pubstatus: usable
        completed: false
        priority: 2
        urgency: 3
        language: en
        languages: [en, fr]
        keywords: [council, budget]
        subject:
          - qcode: "11000000"
            name: politics
          - qcode: local-government
            name: Local government
            scheme: editorial-topics
            parent: government
