    Coverage:
      type: object
      description: A possible content coverage associated with an event or planning item
      properties:
        coverage_id:
          type: string
          description: Unique identifier of the coverage
          example: "urn:newsml:localhost:2021-07-08T12:34:56.123456:coverage-guid"
        profile:
          type: string
          nullable: true
          description: ID of the coverage profile
        original_coverage_id:
          type: string
          nullable: true
        guid:
          type: string
          nullable: true
        original_creator:
          type: string
          nullable: true
        version_creator:
          type: string
          nullable: true
        firstcreated:
          type: string
          format: date-time
        versioncreated:
          type: string
          format: date-time
        previous_status:
          type: string
          nullable: true
        _time_to_be_confirmed:
          type: boolean
        add_coverage_to_workflow:
          type: boolean
        flags:
          type: object
          properties:
            no_content_linking:
              type: boolean
        news_coverage_status:
          type: object
          description: News coverage status
          properties:
            qcode:
              type: string
              enum: [ncostat:int, ncostat:notint, ncostat:notdec, ncostat:onreq]
              example: "ncostat:int"
            name:
              type: string
            label:
              type: string
        workflow_status:
          type: string
          description: Workflow status of the coverage
          enum: [draft, active, ingested, scheduled, killed, cancelled, rescheduled, postponed, spiked]
          example: "active"
        assigned_to:
          $ref: '#/components/schemas/CoverageAssignedTo'
        planning:
          $ref: '#/components/schemas/CoveragePlanning'
        scheduled_updates:
          type: array
          description: Scheduled updates associated with the coverage
          items:
            $ref: '#/components/schemas/CoverageScheduledUpdate'

    CoveragePlanning:
      type: object
      allOf:
        - $ref: '#/components/schemas/ItemEditorialMetadata'
      properties:
        scheduled:
          type: string
          format: date-time
        g2_content_type:
          type: string
          description: Content type qcode; values depend on the installation's vocabulary
          example: text
        description_text:
          type: string
          description: Legacy description alias included by the Planning endpoint
        keyword:
          type: array
          description: Legacy keywords alias included by the Planning endpoint
          items:
            type: string
        coverage_provider:
          $ref: '#/components/schemas/CoverageProvider'
        contact_info:
          type: string
          nullable: true
        workflow_status_reason:
          type: string
          nullable: true
        multiple_content:
          type: boolean
