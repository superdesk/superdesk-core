name: "Test"

on: [push, pull_request]

jobs:
  pytest:
    env:
      ELASTIC_CLIENT_APIVERSIONING: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
            elastic: '7.17.29'
          - os: ubuntu-22.04
            python-version: '3.10'
            elastic: '8.19.6'
          - os: ubuntu-24.04
            python-version: '3.12'
            elastic: '7.17.29'

    runs-on: ${{ matrix.os }}

    services:
      redis:
        image: redis:alpine
        ports:
            - "6379:6379"

      mongo:
        image: mongo:6
        ports:
            - "27017:27017"

      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elastic }}
        ports:
            - "9200:9200"
        env:
            discovery.type: single-node
            xpack.security.enabled: false

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - run: ./scripts/tests_setup
      env:
        SKIP_SERVER_INSTALL: true

    - run: pip install -Ur dev-requirements.txt

    - run: pytest --log-level=ERROR --disable-warnings --timeout=300

  pip-compile:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - run: pip install -Ur dev-requirements.txt
    - run: pip-compile -U setup.py

  behave:
    env:
      ELASTIC_CLIENT_APIVERSIONING: 1

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
            elastic: '7.17.29'
          - os: ubuntu-22.04
            python-version: '3.10'
            elastic: '8.19.6'
          - os: ubuntu-24.04
            python-version: '3.12'
            elastic: '7.17.29'

    runs-on: ${{ matrix.os }}

    services:
      redis:
        image: redis:alpine
        ports:
            - "6379:6379"

      mongo:
        image: mongo:6
        ports:
            - "27017:27017"

      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elastic }}
        ports:
            - "9200:9200"
        env:
            discovery.type: single-node
            xpack.security.enabled: false

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - run: ./scripts/tests_setup
      env: 
        SKIP_SERVER_INSTALL: true
    - run: pip install -Ur dev-requirements.txt

    - run: behave --tags=-sams --format progress2 --logging-level=ERROR

  behave-sams:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.12'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - run: ./scripts/tests_setup
    - run: ./scripts/install-start-sams

    - run: pip install -Ur dev-requirements.txt

    - run: behave --tags=sams --format progress2 --logging-level=ERROR

  prodapi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: '3.10'
          - os: ubuntu-24.04
            python-version: '3.12'

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - run: ./scripts/tests_setup
    - run: pip install -Ur dev-requirements.txt

    - run: pytest prod_api

  macos-install:

    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest']
        python-version: ['3.12']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - run: pip install -Ur dev-requirements.txt
